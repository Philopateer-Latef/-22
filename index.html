<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Gallery Pro</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background: radial-gradient(circle, #1a0033, #000);
  color:white;
}

h1{
  text-align:center;
  padding:20px;
  font-size:40px;
  animation: glow 2s infinite alternate;
}

@keyframes glow{
  from{ text-shadow:0 0 10px #7c3aed; }
  to{ text-shadow:0 0 25px #a855f7; }
}

/* ⭐ auto grid */
.gallery{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:20px;
  padding:25px;
}

@media (max-width:900px){
  .gallery{grid-template-columns:repeat(3,1fr);}
}

@media (max-width:600px){
  .gallery{grid-template-columns:repeat(2,1fr);}
}

/* card */
.card{
  position:relative;
  background:#111;
  padding:8px;
  border-radius:12px;
  overflow:hidden;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #7c3aed;
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px;
}

/* buttons */
.btn{
  position:absolute;
  bottom:10px;
  font-size:12px;
  border:none;
  padding:5px 7px;
  border-radius:6px;
  cursor:pointer;
  color:white;
}

.view-btn{left:10px;background:#22c55e;}
.download-btn{right:10px;background:#7c3aed;}

/* modal */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
}

.modal img{
  max-width:90%;
  max-height:80%;
  border-radius:10px;
}
</style>
</head>

<body>

<h1>🎌 Anime Gallery Pro</h1>

<div class="gallery" id="gallery"></div>

<div class="modal" id="modal" onclick="closeModal()">
  <img id="modalImg">
</div>

<script>

// 🔥 هنا تضيف أي صور بسهولة
const images = [
"1.jpeg","2.jpeg","3.jpeg","4.jpeg","5.jpeg",
"6.jpeg","7.jpeg","8.jpeg","9.jpeg","10.jpeg",
"11.jpeg","12.jpeg","13.jpeg","14.jpeg","15.jpeg",
"16.jpeg","17.jfif","18.jpeg","19.jfif","20.jpeg",
"21.jfif","22.jfif","23.jfif","24.jfif","25.jfif",
"26.jpeg","27.jpeg","28.jpeg","29.jfif","30.jpg",
"31.jpeg","32.jpeg","33.jfif","34.jfif","35.jfif","36.jfif","37.jfif","38.jfif","39.jfif","40.jfif","41.jfif","42.jfif","43.jfif","44.jfif","45.jfif","46.jfif",
];

const gallery = document.getElementById("gallery");

// إنشاء الكروت تلقائي
images.forEach(src => {

  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <img src="${src}">
    <button class="btn view-btn">👁</button>
    <button class="btn download-btn">⬇</button>
  `;

  // view
  card.querySelector(".view-btn").onclick = () => {
    document.getElementById("modalImg").src = src;
    document.getElementById("modal").style.display = "flex";
  };

  // download
  card.querySelector(".download-btn").onclick = () => {
    const a = document.createElement("a");
    a.href = src;
    a.download = "anime.jpg";
    a.click();
  };

  gallery.appendChild(card);
});

function closeModal(){
  document.getElementById("modal").style.display = "none";
}

</script>
<footer style="
  text-align:center;
  padding:20px;
  margin-top:30px;
  border-top:1px solid #333;
  color:#aaa;
  font-size:14px;
">

  <p>👨‍💻 Developer: Philopateer Latef</p>
  <p>📧 Email:philo22122010@gmail.com</p>
  <p>📱 Phone:01505857982</p>

</footer>
</body>
</html>
